<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Validacion de Usuarios</title>

<style>

body{
    font-family: Verdana, Geneva, Tahoma, sans-serif;
    background: linear-gradient(135deg,#667eaa,#764ba2);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.caja{
    background:#5f9cff;
    padding:30px;
    width:380px;
    border-radius:12px;
    box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
    margin-bottom:5px;
}

.descripcion{
    text-align:center;
    font-size:14px;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    border-radius:6px;
    border:1px solid #ccc;
}

button{
    width:100%;
    padding:10px;
    border:none;
    border-radius:6px;
    background: #8f6ed5;;
    color:black;
    font-size:15px;
    cursor:pointer;
}

button:hover{
    background:#0d7d73;
}

#mensaje{
    margin-top:15px;
    font-weight:bold;
}

.error{
    color:red;
}

.correcto{
    color:green;
}

.info{
    color:#333;
}

</style>

</head>
<body>

<div class="caja">

<h2>Registro de Usuarios</h2>
<p class="descripcion">Ingrese lo solicitado a continuacion..</p>

<form id="formRegistro">

<label>Ingrese su Nombre</label>
<input type="text" id="nombreUsuario">

<label>Ingrese su Edad</label>
<input type="number" id="edadUsuario">

<button type="submit">Comprobar Informacion</button>

</form>

<div id="mensaje"></div>

</div>

<script>

// ---------- PARTE 1 CALLBACK ----------
function revisarFormulario(nombre, edad, callback){

    let mensaje = document.getElementById("mensaje");

    if(nombre.trim() === "" || edad === ""){
        mensaje.innerHTML = "Debes completar todos los campos antes.";
        mensaje.className = "error";
        return;
    }

    callback(nombre, edad);
}


// ---------- PARTE 2 PROMESA ----------
function verificarEdadServidor(edad){

    return new Promise((resolve,reject)=>{

        setTimeout(()=>{

            if(edad > 0){
                resolve(edad);
            }else{
                reject("La edad ingresada no es válida.");
            }

        },1800);

    });

}


// ---------- PARTE 3 ASYNC / AWAIT ----------
async function iniciarValidacion(nombre, edad){

    let mensaje = document.getElementById("mensaje");

    try{

        mensaje.innerHTML = "Comprobando datos en el servidor...";
        mensaje.className = "info";

        let edadValidada = await verificarEdadServidor(edad);

        if(edadValidada >= 18){
            mensaje.innerHTML = nombre + " puedes ingresar eres (mayor de edad).";
            mensaje.className = "correcto";
        }else{
            mensaje.innerHTML = nombre + " no cumples con la mayoria de edad.";
            mensaje.className = "info";
        }

    }catch(error){

        mensaje.innerHTML = error;
        mensaje.className = "error";

    }

}


// ---------- EVENTO DEL FORMULARIO ----------
document.getElementById("formRegistro").addEventListener("submit", function(e){

    e.preventDefault();

    let nombre = document.getElementById("nombreUsuario").value;
    let edad = document.getElementById("edadUsuario").value;

    revisarFormulario(nombre, edad, iniciarValidacion);

});

</script>

</body>
</html>
