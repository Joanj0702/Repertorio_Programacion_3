<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Registro</title>
</head>

<body>

    <center><h1>Formulario de Registro de Usuarios</h1></center><br><br>

    <form action="#" method="post">

        <!-- Nombre -->
        <label for="nombre">Nombre completo:</label><br>
        <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre completo" required><br><br>

        <!-- Apellidos -->
        <label for="nombre">Apellidos:</label><br>
        <input type="text" id="apellido" name="apellido" placeholder="Ingrese sus Apellidos" required><br><br>

        <!-- Correo -->
        <label for="correo">Correo electrónico:</label><br>
        <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required><br><br>

        <!-- Contraseña -->
        <label for="password">Contraseña:</label><br>
        <input type="password" id="password" name="password" placeholder="Ingrese su contraseña" required><br><br>

        <!-- Edad -->
        <label for="edad">Edad:</label><br>
        <input type="number" id="edad" name="edad" placeholder="Ingrese su edad" required><br><br>

        <!-- Radio buttons -->
        <label>Género:</label><br>
        <input type="radio" id="masculino" name="genero" value="masculino" required>
        <label for="masculino">Masculino</label><br>

        <input type="radio" id="femenino" name="genero" value="femenino">
        <label for="femenino">Femenino</label><br>

        <input type="radio" id="otro" name="genero" value="otro">
        <label for="otro">Otro</label><br><br>

        <!-- Checkbox -->
        <input type="checkbox" id="terminos" name="terminos" required>
        <label for="terminos">Acepto los términos y condiciones</label><br><br>

        <!-- Select -->
        <label for="tipo">Tipo de usuario:</label><br>
        <select id="tipo" name="tipo" required>
            <option value="">Seleccione una opción</option>
            <option value="estudiante">Estudiante</option>
            <option value="docente">Docente</option>
            <option value="administrativo">Administrativo</option>
        </select><br><br>

        <!-- Textarea -->
        <label for="comentarios">Comentarios:</label><br>
        <textarea id="comentarios" name="comentarios" rows="4" cols="40" placeholder="Escriba sus comentarios aquí"></textarea><br><br>

        <!-- Botones -->
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpiar">

    </form>

</body>
</html>
